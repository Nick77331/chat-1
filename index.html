<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Room</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; }
    #chat { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; padding: 20px; }
    #messages { list-style: none; padding: 0; max-height: 300px; overflow-y: auto; }
    #messages li { padding: 8px; margin: 5px 0; border-bottom: 1px solid #eee; }
    form { display: flex; margin-top: 10px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; border: none; background-color: #007BFF; color: #fff; border-radius: 4px; margin-left: 5px; }
  </style>
</head>
<body>
  <div id="chat">
    <h2>💬 Chat Room</h2>
    <ul id="messages"></ul>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Type your message..." />
      <button>Send</button>
    </form>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
