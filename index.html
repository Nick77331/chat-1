<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GameVibe Real-Time Chat</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet" />
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
  body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: linear-gradient(135deg, #ff0066, #ffcc00, #66ff66, #00ccff);
    background-size: 600% 600%;
    animation: gradient 20s ease infinite;
    color: #fff;
  }

  @keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
  }

  header {
    text-align: center;
    padding: 20px;
    font-size: 2em;
    text-shadow: 0 0 10px #fff, 0 0 20px #0ff;
  }

  #loginSection {
    display: flex;
    justify-content: center;
    margin: 10px;
  }

  #loginSection input {
    padding: 10px;
    font-size: 1em;
    border-radius: 5px;
    border: none;
    margin-right: 10px;
  }

  #loginSection button {
    padding: 10px 20px;
    font-size: 1em;
    border-radius: 5px;
    border: none;
    background-color: #0ff;
    cursor: pointer;
  }

  #chatContainer {
    display: none;
    max-width: 800px;
    margin: 0 auto;
    height: 80vh;
    display: flex;
    flex-direction: column;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    background-color: rgba(0,0,0,0.3);
    border-radius: 10px;
  }

  .message {
    margin: 8px 0;
    padding: 8px;
    border-radius: 8px;
    background-color: #222;
    border: 2px solid #0ff;
    max-width: 70%;
  }

  .message img {
    max-width: 200px;
    margin-top: 5px;
    border-radius: 4px;
    border: 2px solid #0ff;
  }

  #inputSection {
    display: flex;
    margin-top: 10px;
  }

  #messageInput {
    flex: 1;
    padding: 10px;
    border-radius: 5px;
    border: none;
    font-size: 1em;
  }

  #sendBtn, #uploadBtn {
    padding: 10px 15px;
    margin-left: 10px;
    border: none;
    border-radius: 5px;
    background-color: #0ff;
    cursor: pointer;
  }
</style>
</head>
<body>
<header>🎮 GameVibe Real-Time Chat 🎮</header>

<div id="loginSection">
  <input type="text" id="username" placeholder="Enter your username" />
  <button onclick="login()">Join Chat</button>
</div>

<div id="chatContainer">
  <div id="messages"></div>
  <div id="inputSection">
    <input type="text" id="messageInput" placeholder="Type a message" />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
    <input type="file" id="uploadBtn" accept="image/*" onchange="sendImage()" style="display:none" />
    <button onclick="document.getElementById('uploadBtn').click()">📷</button>
  </div>
</div>

<script>
  // Replace this config object with your Firebase project config
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let username = '';
  let chatRef;

  function login() {
    const nameInput = document.getElementById('username');
    username = nameInput.value.trim();
    if (!username) {
      alert('Please enter a username');
      return;
    }
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('chatContainer').style.display = 'flex';

    // Create a chat room or use a fixed one
    chatRef = db.ref('chat');

    // Load existing messages
    chatRef.on('child_added', snapshot => {
      const msg = snapshot.val();
      addMessage(msg.sender, msg.text, msg.isImage);
    });
  }

  function sendMessage() {
    const msg = document.getElementById('messageInput').value.trim();
    if (msg && chatRef) {
      chatRef.push({ sender: username, text: msg, isImage: false });
      document.getElementById('messageInput').value = '';
    }
  }

  function sendImage() {
    const file = document.getElementById('uploadBtn').files[0];
    if (file && chatRef) {
      const reader = new FileReader();
      reader.onload = () => {
        chatRef.push({ sender: username, text: reader.result, isImage: true });
      };
      reader.readAsDataURL(file);
    }
  }

  function addMessage(sender, text, isImage) {
    const container = document.getElementById('messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message';

    if (isImage) {
      const img = document.createElement('img');
      img.src = text;
      msgDiv.innerHTML = `<strong>${sender}:</strong><br/>`;
      msgDiv.appendChild(img);
    } else {
      msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
    }

    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
  }
</script>
</body>
</html>
